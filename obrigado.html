<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Recebida | Academia Murabula</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl max-w-lg w-full text-center">
        <!-- Ícone de Sucesso -->
        <div class="mb-6">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
        </div>
        
        <h1 class="text-2xl font-bold text-[#1A2B4C] mb-2">Inscrição Recebida!</h1>
        <p id="mensagemStatus" class="text-gray-600 mb-6 text-sm">Os seus dados foram registados com sucesso. Confira abaixo o resumo:</p>

        <!-- Resumo dos Dados -->
        <div id="resumoDados" class="bg-gray-50 p-5 rounded-lg text-left text-sm text-gray-700 mb-6 border border-gray-100 shadow-inner space-y-2">
            <p class="text-gray-400 italic text-center">A carregar resumo...</p>
        </div>

        <div id="acoesPosInscricao">
            <p class="text-gray-500 text-xs mb-6">
                Clique no botão abaixo para nos enviar este resumo diretamente no WhatsApp e agilizar o seu atendimento.
            </p>

            <!-- Botão WhatsApp Dinâmico -->
            <a id="btnWhatsApp" href="#" target="_blank" class="block bg-green-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-600 transition mb-3 w-full shadow-md text-center flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.187 0-5.782 2.594-5.782 5.781 0 1.02.266 2.008.766 2.875L6.75 17.156l2.453-.641c.844.469 1.812.719 2.812.719 3.187 0 5.781-2.594 5.781-5.781 0-3.188-2.594-5.781-5.781-5.781zM12.031 15.656c-.844 0-1.656-.234-2.375-.688l-1.687.437.453-1.641c-.516-.812-.797-1.75-.797-2.734 0-2.859 2.328-5.187 5.187-5.187 2.859 0 5.187 2.328 5.187 5.187 0 2.86-2.328 5.187-5.187 5.187z"/></svg>
                Enviar Dados p/ WhatsApp
            </a>
        </div>

        <a href="index.html" class="block text-[#2A5B8C] font-semibold hover:underline mt-4 text-sm">
            Voltar ao Início
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const labels = {
                'form_nome': 'Nome',
                'form_telefone': 'Telefone',
                'form_email': 'E-mail',
                'form_provincia': 'Província',
                'form_cidade': 'Cidade',
                'form_curso': 'Curso',
                'form_modalidade': 'Modalidade',
                'form_formaInscricao': 'Tipo de Inscrição',
                'form_formaPagamento': 'Forma de Pagamento',
                'form_idTransacao': 'ID Transação'
            };

            const resumoDiv = document.getElementById('resumoDados');
            const btnWhatsApp = document.getElementById('btnWhatsApp');
            const acoesPosInscricao = document.getElementById('acoesPosInscricao');
            const mensagemStatus = document.getElementById('mensagemStatus');
            
            let temDados = false;
            let mensagemWhatsApp = "Olá! Gostaria de confirmar a minha inscrição com os seguintes dados:%0A%0A";

            // Limpa o placeholder
            resumoDiv.innerHTML = '';

            // Preencher resumo visual e construir mensagem
            Object.keys(labels).forEach(key => {
                const valor = sessionStorage.getItem(key);
                
                // Verifica se existe valor e se não é um ID Transação vazio/padrão irrelevante
                if (valor && valor !== 'N/A (Pré-inscrição)') {
                    temDados = true;
                    
                    // Adiciona ao resumo visual
                    const p = document.createElement('p');
                    p.className = 'flex justify-between border-b border-gray-200 pb-1 last:border-0';
                    p.innerHTML = `<span class="font-semibold text-gray-800">${labels[key]}:</span> <span class="text-gray-600">${valor}</span>`;
                    resumoDiv.appendChild(p);

                    // Adiciona à mensagem do WhatsApp codificada
                    mensagemWhatsApp += `*${labels[key]}:* ${valor}%0A`;
                }
            });

            if (!temDados) {
                resumoDiv.innerHTML = '<p class="text-red-500 text-center text-sm">Nenhum dado de inscrição encontrado. Certifique-se de que preencheu o formulário na página inicial.</p>';
                acoesPosInscricao.style.display = 'none';
                mensagemStatus.innerText = 'Ops, parece que não há dados de inscrição.';
            } else {
                // Configurar Link do WhatsApp Dinâmico
                const numeroAdmin = "258860769065";
                btnWhatsApp.href = `https://wa.me/${numeroAdmin}?text=${mensagemWhatsApp}`;
            }
        });
    </script>
</body>
</html>
