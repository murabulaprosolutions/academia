<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Recebida | Academia Murabula</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl max-w-lg w-full text-center">
        <div class="mb-6">
            <svg class="w-16 h-16 text-green-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <h1 class="text-2xl font-bold text-[#1A2B4C] mb-2">Inscrição Recebida!</h1>
        <p class="text-gray-600 mb-6 text-sm">Os seus dados foram registados. Aqui está o resumo da sua inscrição:</p>

        <!-- Resumo dos Dados -->
        <div id="resumoDados" class="bg-gray-50 p-4 rounded-lg text-left text-sm text-gray-700 mb-6 border border-gray-100 shadow-inner">
            <!-- Dados preenchidos via JS -->
        </div>

        <p class="text-gray-500 text-xs mb-6">
            Clique no botão abaixo para nos enviar este resumo diretamente no WhatsApp e agilizar o atendimento.
        </p>

        <!-- Botão WhatsApp Dinâmico -->
        <a id="btnWhatsApp" href="#" target="_blank" class="block bg-green-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-600 transition mb-3 w-full shadow-md">
            Enviar Dados p/ WhatsApp
        </a>

        <a href="index.html" class="block text-[#2A5B8C] font-semibold hover:underline mt-4 text-sm">
            Voltar ao Início
        </a>
    </div>

    <script>
        // Mapeamento de campos para exibição amigável
        const labels = {
            'form_nome': 'Nome',
            'form_telefone': 'Telefone',
            'form_email': 'E-mail',
            'form_provincia': 'Província',
            'form_cidade': 'Cidade',
            'form_curso': 'Curso',
            'form_modalidade': 'Modalidade',
            'form_formaInscricao': 'Tipo',
            'form_formaPagamento': 'Pagamento',
            'form_idTransacao': 'ID Transação'
        };

        const resumoDiv = document.getElementById('resumoDados');
        let mensagemWhatsApp = "Olá! Gostaria de confirmar a minha inscrição com os seguintes dados:%0A%0A";

        // Preencher resumo visual e construir mensagem
        Object.keys(labels).forEach(key => {
            const valor = sessionStorage.getItem(key);
            if (valor) {
                // Adiciona ao resumo visual (apenas se for relevante mostrar)
                const p = document.createElement('p');
                p.className = 'mb-1 flex justify-between border-b border-gray-200 pb-1';
                p.innerHTML = `<span class="font-semibold text-gray-800">${labels[key]}:</span> <span class="text-gray-600">${valor}</span>`;
                resumoDiv.appendChild(p);

                // Adiciona à mensagem do WhatsApp
                mensagemWhatsApp += `*${labels[key]}:* ${valor}%0A`;
            }
        });

        // Configurar Link do WhatsApp Dinâmico
        const numeroAdmin = "258860769065";
        document.getElementById('btnWhatsApp').href = `https://wa.me/${numeroAdmin}?text=${mensagemWhatsApp}`;
    </script>
</body>
</html>
