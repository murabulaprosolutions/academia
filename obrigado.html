<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Recebida | Academia Murabula</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 md:p-12 rounded-2xl shadow-xl max-w-lg w-full text-center">
        <div class="mb-6">
            <svg class="w-20 h-20 text-green-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <h1 class="text-2xl md:text-3xl font-bold text-[#1A2B4C] mb-4">Inscrição Recebida com Sucesso!</h1>
        
        <p class="text-gray-600 mb-6">
            Olá, <span id="displayName" class="font-bold text-[#2A5B8C]">Visitante</span>! 
            Agradecemos o seu interesse no curso de <span id="displayCurso" class="font-bold text-[#2A5B8C]">nosso curso</span>.
        </p>

        <p class="text-gray-500 text-sm mb-8">
            A nossa equipa administrativa já recebeu os seus dados e entrará em contacto muito em breve via WhatsApp ou E-mail para finalizar a sua inscrição.
        </p>

        <!-- Botão WhatsApp Dinâmico -->
        <a id="btnWhatsApp" href="https://wa.me/258860769065" target="_blank" class="inline-block bg-green-500 text-white px-8 py-3 rounded-lg font-semibold hover:bg-green-600 transition mb-4 block">
            Enviar Comprovativo no WhatsApp
        </a>

        <a href="index.html" class="inline-block bg-[#2A5B8C] text-white px-8 py-3 rounded-lg font-semibold hover:bg-[#1A2B4C] transition">
            Voltar ao Início
        </a>
    </div>

    <script>
        // Recuperar dados do sessionStorage
        const nome = sessionStorage.getItem('userName');
        const curso = sessionStorage.getItem('userCurso');

        // Preencher na página se existirem
        if (nome) document.getElementById('displayName').innerText = nome;
        if (curso) document.getElementById('displayCurso').innerText = curso;

        // Configurar Link do WhatsApp Dinâmico
        if (curso) {
            const numeroAdmin = "258860769065";
            const mensagem = encodeURIComponent(`Olá! Acabei de me inscrever no curso de "${curso}" e gostaria de enviar o meu comprovativo de pagamento.`);
            document.getElementById('btnWhatsApp').href = `https://wa.me/${numeroAdmin}?text=${mensagem}`;
        }
    </script>
</body>
</html>
